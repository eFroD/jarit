name: Dev images

# Publishes every change on dev so it can be tried on a real machine without a
# local build. Each commit gets an immutable dev-<sha7> tag; dev follows the
# newest commit for which both images built. Release tags (latest, X.Y, X.Y.Z)
# and the release build cache are never written here.

on:
  push:
    branches: [dev]
  workflow_dispatch:

# One run at a time and the newest commit wins, so dev never moves backwards.
concurrency:
  group: dev-images
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: backend
            context: .
            file: ./Dockerfile.backend
          - image: frontend
            context: ./frontend
            file: ./frontend/Dockerfile

    steps:
      - name: Only publish from dev
        if: github.ref != 'refs/heads/dev'
        run: |
          echo "::error::Dev images are only built from dev"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        id: repo
        run: echo "repository=${GITHUB_REPOSITORY@L}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository }}/${{ matrix.image }}
          # Only the commit tag; dev is moved by the promote job.
          tags: |
            type=sha,prefix=dev-
          labels: |
            org.opencontainers.image.version=dev-{{sha}}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          # Newest yt-dlp, as for a release (see Dockerfile.backend); the
          # frontend ignores it.
          build-args: |
            YTDLP_REFRESH=${{ github.run_id }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The release cache is only read, so dev builds never displace it.
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.repository }}/${{ matrix.image }}:buildcache-dev
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.repository }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.repository }}/${{ matrix.image }}:buildcache-dev,mode=max

  promote:
    # dev only moves after both images built, so it never points to a mixed or
    # partial pair. imagetools create copies manifests only, no layers.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set lowercase repository name
        id: repo
        run: echo "repository=${GITHUB_REPOSITORY@L}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move dev to this commit
        env:
          REPOSITORY: ${{ steps.repo.outputs.repository }}
        run: |
          sha7="${GITHUB_SHA::7}"
          for image in backend frontend; do
            ref="$REGISTRY/$REPOSITORY/$image"
            docker buildx imagetools create --tag "$ref:dev" "$ref:dev-$sha7"
          done

          {
            echo "## Dev images"
            echo
            echo "Commit \`$GITHUB_SHA\`, tag \`dev-$sha7\`"
            echo
            echo "| Image | Digest |"
            echo "|-------|--------|"
            for image in backend frontend; do
              ref="$REGISTRY/$REPOSITORY/$image"
              digest=$(docker buildx imagetools inspect "$ref:dev" --format '{{.Manifest.Digest}}')
              echo "| \`$ref:dev\` | \`$digest\` |"
            done
            echo
            echo "Pin this build with \`JARIT_IMAGE_TAG=dev-$sha7\`."
          } >> "$GITHUB_STEP_SUMMARY"
